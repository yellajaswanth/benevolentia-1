env:
  num_envs: 8192
  episode_length: 1000
  dt: 0.005
  control_decimation: 4
  # Gait clock: left foot leads, right foot half a cycle behind.
  gait_frequency: 1.25
  stance_ratio: 0.55
  
robot:
  asset_path: "assets/unitree_h1/scene.xml"  # robot + floor; h1.xml alone has no ground
  num_actions: 19
  action_scale: 0.25
  # initial_height is derived from default_joint_angles so the feet start on the
  # floor (about 0.98 m for this pose). Only set it to override.
  default_joint_angles:
    left_hip_yaw: 0.0
    left_hip_roll: 0.0
    left_hip_pitch: -0.4
    left_knee: 0.8
    left_ankle: -0.4
    right_hip_yaw: 0.0
    right_hip_roll: 0.0
    right_hip_pitch: -0.4
    right_knee: 0.8
    right_ankle: -0.4
    torso: 0.0
    left_shoulder_pitch: 0.0
    left_shoulder_roll: 0.0
    left_shoulder_yaw: 0.0
    left_elbow: 0.0
    right_shoulder_pitch: 0.0
    right_shoulder_roll: 0.0
    right_shoulder_yaw: 0.0
    right_elbow: 0.0

observation:
  joint_pos: true
  joint_vel: true
  base_quat: true
  base_ang_vel: true
  command_vel: true
  projected_gravity: true

commands:
  # Curriculum stage A: one fixed forward command. Widen once this walks.
  vx_range: [0.5, 0.5]
  vy_range: [0.0, 0.0]
  vyaw_range: [0.0, 0.0]
  resample_time: 10.0

rewards:
  # Weights carry their sign. Keep tracking_sigma small: a forgiving sigma pays a
  # robot standing still almost as much as one walking (see tests/test_reward_sanity.py).
  tracking_lin_vel: 1.0
  tracking_ang_vel: 0.5
  tracking_sigma: 0.25
  contact_match: 0.2
  feet_air_time: 1.0
  feet_air_time_max: 0.5
  feet_phase: 1.0
  feet_phase_sigma: 0.01
  swing_height_target: 0.08
  feet_slip: -0.05
  orientation: -1.0
  base_height: -10.0
  target_height: 0.98
  lin_vel_z: -2.0
  ang_vel_xy: -0.05
  action_rate: -0.01
  torques: -1.0e-5
  hip_deviation: -1.0
  alive: 0.15
  termination: -10.0
  move_command_threshold: 0.1

termination:
  max_pitch: 0.5
  max_roll: 0.5
  min_height: 0.3

domain_randomization:
  friction:
    enabled: false
    range: [0.2, 1.0]
  mass:
    enabled: false
    scale_range: [0.9, 1.1]
  motor_strength:
    enabled: false
    scale_range: [0.85, 1.15]
  push_force:
    enabled: false
    magnitude_range: [0.0, 50.0]
    interval: [5.0, 15.0]
  latency:
    enabled: false
    range_ms: [0, 20]

training:
  total_timesteps: 200_000_000
  num_evals: 20
  seed: 42

# Brax PPO (scripts/train_brax.py). batch_size defaults to num_envs / num_minibatches,
# so each update uses one unroll per env: 8192 envs x 20 steps = 163,840 env steps.
brax_ppo:
  learning_rate: 3.0e-4
  entropy_cost: 0.01
  discounting: 0.97
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  normalize_observations: true
  reward_scaling: 1.0
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 1.0

network:
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes: [512, 256, 128]

evaluation:
  seeds: [0, 1, 2]
  max_steps: 1000
  fixed_commands:
    - name: "stand"
      command: [0.0, 0.0, 0.0]
    - name: "forward_slow"
      command: [0.25, 0.0, 0.0]
    - name: "forward_fast"
      command: [0.5, 0.0, 0.0]
